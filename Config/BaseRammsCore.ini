[CoreRedirects]
; The MeBot is RAMMP Gen1: its controller, curb controller and their types were renamed. Here, with the plugin, so
; every project that uses it loads assets saved with the old names.
+ClassRedirects=(OldName="/Script/RammsCore.MebotControllerComponent",NewName="/Script/RammsCore.RammpGen1ControllerComponent")
+ClassRedirects=(OldName="/Script/RammsCore.RammsMebotCurbController",NewName="/Script/RammsCore.RammsRammpGen1CurbController")
+StructRedirects=(OldName="/Script/RammsCore.RammsMebotCurbConfig",NewName="/Script/RammsCore.RammsRammpGen1CurbConfig")
+StructRedirects=(OldName="/Script/RammsCore.RammsMebotSupportTable",NewName="/Script/RammsCore.RammsRammpGen1SupportTable")
+EnumRedirects=(OldName="/Script/RammsCore.ERammsMebotCurbPhase",NewName="/Script/RammsCore.ERammsRammpGen1CurbPhase")
